[project]
name = "pivot-agent"
version = "0.1.0"
description = "A layered agent framework for edge, industrial, and embodied systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbus-next>=0.2.3",
    "litellm>=1.40",
    "textual>=8.2.8",
    "tomli-w>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
pivot = "pivot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
