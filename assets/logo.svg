<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D7BFF"/>
      <stop offset="45%" stop-color="#6A5CFF"/>
      <stop offset="100%" stop-color="#A64DFF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A8CFF"/>
      <stop offset="50%" stop-color="#7D6BFF"/>
      <stop offset="100%" stop-color="#B061FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7FF"/>
    </linearGradient>
    <radialGradient id="gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FA8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FA8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A4BFF" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 白色圆角背景 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- 后半环：轨道在星星背后 -->
  <path d="M97.1 246.7 L104.8 240.1 L113.1 233.6 L122.2 227.1 L131.9 220.9 L142.2 214.7 L153.1 208.8 L164.5 203.2 L176.3 197.7 L188.5 192.6 L201.0 187.8 L213.8 183.3 L226.8 179.1 L240.0 175.3 L253.2 172.0 L266.5 169.0 L279.6 166.4 L292.7 164.3 L305.6 162.7 L318.3 161.5 L330.6 160.7 L342.6 160.4 L354.2 160.6 L365.3 161.3 L375.8 162.4 L385.8 163.9 L395.1 166.0 L403.8 168.4 L411.7 171.3 L418.9 174.6 L425.3 178.3 L430.9 182.3 L435.6 186.8 L439.4 191.5 L442.4 196.6 L444.4 202.0 L445.5 207.6 L445.7 213.5 L445.0 219.5 L443.3 225.8 L440.8 232.2 L437.3 238.7 L433.0 245.3 L427.8 252.0 L421.7 258.6 L414.9 265.3" fill="none" stroke="url(#ringGrad)" stroke-width="11"
        stroke-linecap="round" opacity="0.55"/>

  <!-- 主四芒星 -->
  <g filter="url(#shadow)">
    <path d="M256 96
             C268 196 312 244 408 256
             C312 268 268 316 256 416
             C244 316 200 268 104 256
             C200 244 244 196 256 96 Z"
          fill="url(#starGrad)"/>
    <path d="M256 96
             C268 196 312 244 408 256
             C312 268 268 316 256 416
             C244 316 200 268 104 256
             C200 244 244 196 256 96 Z"
          fill="url(#gloss)"/>
  </g>

  <!-- 前半环：轨道绕到星星前方 -->
  <path d="M414.9 265.3 L407.2 271.9 L398.9 278.4 L389.8 284.9 L380.1 291.1 L369.8 297.3 L358.9 303.2 L347.5 308.8 L335.7 314.3 L323.5 319.4 L311.0 324.2 L298.2 328.7 L285.2 332.9 L272.0 336.7 L258.8 340.0 L245.5 343.0 L232.4 345.6 L219.3 347.7 L206.4 349.3 L193.7 350.5 L181.4 351.3 L169.4 351.6 L157.8 351.4 L146.7 350.7 L136.2 349.6 L126.2 348.1 L116.9 346.0 L108.2 343.6 L100.3 340.7 L93.1 337.4 L86.7 333.7 L81.1 329.7 L76.4 325.2 L72.6 320.5 L69.6 315.4 L67.6 310.0 L66.5 304.4 L66.3 298.5 L67.0 292.5 L68.7 286.2 L71.2 279.8 L74.7 273.3 L79.0 266.7 L84.2 260.0 L90.3 253.4 L97.1 246.7" fill="none" stroke="url(#ringGrad)" stroke-width="11"
        stroke-linecap="round" opacity="0.95"/>

  <!-- 交互节点：光晕 + 实心点 -->
  <circle cx="375.0" cy="294.2" r="26" fill="url(#nodeGlow)"/>
  <circle cx="375.0" cy="294.2" r="11" fill="#FFFFFF"/>
  <circle cx="375.0" cy="294.2" r="7.5" fill="url(#ringGrad)"/>
</svg>